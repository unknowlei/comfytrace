name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
      - run: |
          $ErrorActionPreference = 'Stop'
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - if: runner.os == 'Linux'
        run: |
          $ErrorActionPreference = 'Stop'
          npx playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser install failed' }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Browser tests failed' }
      - if: runner.os == 'Linux'
        run: |
          $ErrorActionPreference = 'Stop'
          npm run package
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ComfyTrace-portable
          path: release/
          retention-days: 14
      - if: runner.os == 'Linux' && github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
