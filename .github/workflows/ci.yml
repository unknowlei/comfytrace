name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
      - run: |
          $ErrorActionPreference = 'Stop'
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - if: runner.os == 'Linux'
        run: |
          $ErrorActionPreference = 'Stop'
          npx playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser install failed' }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Browser tests failed' }
      - if: runner.os == 'Linux'
        run: |
          $ErrorActionPreference = 'Stop'
          npm run package
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ComfyTrace-portable
          path: release/
          retention-days: 14
      - if: runner.os == 'Linux' && github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
